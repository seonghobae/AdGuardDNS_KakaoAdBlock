name: Generate Kakao AdBlock Filter

on:
  schedule:
    # Run every hour (only opens a PR when changes are detected)
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - 'develop'
      - 'main'
    paths:
      - 'scripts/**'
      - '.github/workflows/generate-filter.yml'

concurrency:
  group: generate-filter-${{ github.ref }}
  cancel-in-progress: true

env:
  FILTER_FILE: 'kakao-adblock-filter.txt'
  AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
  AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

jobs:
  generate-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: false  # Skip private submodule

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: Create GitHub App token (optional)
        id: app-token
        if: env.AUTOMATION_APP_ID != '' && env.AUTOMATION_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.AUTOMATION_APP_ID }}
          private-key: ${{ env.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Get current timestamp
        id: timestamp
        run: |
          echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "short_date=$(date -u '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies with uv
        run: |
          # Install project dependencies
          uv venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip install -e ".[dev]"

      - name: Generate Kakao AdBlock Filter from Sources
        run: |
          echo "Collecting Kakao/Daum domains from real data sources..."
          source .venv/bin/activate
          python scripts/collect_kakao_domains.py "${{ env.FILTER_FILE }}"

          if [ ! -f "${{ env.FILTER_FILE }}" ]; then
            echo "Error: Filter file was not generated"
            exit 1
          fi

          echo "Filter generation completed"

      - name: Validate filter syntax
        run: |
          # Basic syntax validation
          echo "Validating filter syntax..."

          # Check for proper AdGuard DNS syntax
          if grep -E '^[^!#].*[^$]$' "${{ env.FILTER_FILE }}" | grep -v '||.*\^' | grep -v '^[a-zA-Z0-9.-]*$'; then
            echo "Warning: Some lines may not follow proper AdGuard DNS syntax"
          fi

          # Count rules
          RULE_COUNT=$(grep -c '^||.*\^' "${{ env.FILTER_FILE }}" || echo "0")
          echo "Generated $RULE_COUNT blocking rules"

          # Check minimum rule count
          if [ "$RULE_COUNT" -lt 10 ]; then
            echo "Warning: Low rule count ($RULE_COUNT), expected at least 10 domains"
          fi

          # Verify file is not empty
          if [ ! -s "${{ env.FILTER_FILE }}" ]; then
            echo "Error: Filter file is empty"
            exit 1
          fi

          # Check for required header information
          if ! grep -q "Title:" "${{ env.FILTER_FILE }}"; then
            echo "Error: Filter missing required title header"
            exit 1
          fi

          echo "Filter validation completed successfully - $RULE_COUNT rules generated"

      - name: Run DNS validation tests
        run: |
          echo "Running DNS validation tests..."
          source .venv/bin/activate

          # Run pytest tests if they exist
          if [ -f "tests/test_dns_validator.py" ]; then
            python -m pytest tests/test_dns_validator.py -v --tb=short
          fi

          # Run quick validation test
          if [ -f "scripts/dns_validator.py" ]; then
            echo ""
            echo "Running quick domain validation..."
            python scripts/dns_validator.py --test
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD -- "${{ env.FILTER_FILE }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in filter file"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in filter file"
            git diff --name-only HEAD -- "${{ env.FILTER_FILE }}"
          fi

      - name: Create or update pull request
        id: cpr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: automation/kakao-filter-update
          base: develop
          delete-branch: true
          add-paths: |
            ${{ env.FILTER_FILE }}
          commit-message: "chore: update Kakao AdBlock filter - ${{ steps.timestamp.outputs.date }}"
          title: "chore: update Kakao AdBlock filter"
          body: |
            ## Summary
            - Automated update of `kakao-adblock-filter.txt` generated by the scheduled workflow.

            ## Verification
            - Filter generation completed in CI
            - Syntax validation completed in CI
            - DNS validator tests completed in CI

      - name: Enable auto-merge for automation PR
        if: steps.changes.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != '' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge --repo "${{ github.repository }}" "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --delete-branch

      - name: Note missing GitHub App token
        if: steps.changes.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number != '' && steps.app-token.outputs.token == ''
        run: |
          echo "GitHub App token secrets are not configured."
          echo "The automation PR was created with GITHUB_TOKEN, so PR-triggered workflows may not run."
          echo "Configure secrets AUTOMATION_APP_ID and AUTOMATION_APP_PRIVATE_KEY to enable fully self-gating updates."

      - name: Create release asset info
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Generate filter statistics
          TOTAL_RULES=$(grep -c '^||.*\^' "${{ env.FILTER_FILE }}" || echo "0")
          KAKAO_RULES=$(grep -c '^||.*kakao.*\^' "${{ env.FILTER_FILE }}" || echo "0")
          DAUM_RULES=$(grep -c '^||.*daum.*\^' "${{ env.FILTER_FILE }}" || echo "0")
          SOURCES=$(grep "Generated from" "${{ env.FILTER_FILE }}" | head -1 || echo "Unknown")

          {
            echo "## Kakao AdBlock Filter Statistics"
            echo "- Total blocking rules: $TOTAL_RULES"
            echo "- Kakao-related domains: $KAKAO_RULES"
            echo "- Daum-related domains: $DAUM_RULES"
            echo "- $SOURCES"
            echo "- Last updated: ${{ steps.timestamp.outputs.date }}"
            echo ""
            echo "## Data Sources"
            echo "- **List-KR**: Korean-language website filters list"
            echo "- **YousList**: Block filter for advertisements, mainly on Korean sites"
            echo ""
            echo "## Usage"
            echo "Add this URL to your AdGuard DNS custom filters:"
            echo "\`https://raw.githubusercontent.com/${{ github.repository }}/develop/${{ env.FILTER_FILE }}\`"
            echo ""
            echo "## Auto-Update Schedule"
            echo "This filter is automatically updated every hour to include the latest blocking rules from upstream sources."
          } > filter-stats.md

          cat filter-stats.md

      - name: Upload filter as artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kakao-adblock-filter-${{ steps.timestamp.outputs.short_date }}
          path: |
            ${{ env.FILTER_FILE }}
            filter-stats.md
          retention-days: 30
